<!doctype html>
<html>
<body>
<script>
// 验证脚本:尝试打开 CherryStudio 的 IndexedDB 并统计各 store 记录数
function setTitle(t) {
  document.title = t;
  document.body.textContent = t;
}
const req = indexedDB.open('CherryStudio');
req.onerror = () => setTitle('ERR:' + (req.error && req.error.message));
req.onsuccess = async () => {
  try {
    const db = req.result;
    const names = Array.from(db.objectStoreNames);
    const summary = {};
    const blocks = [];
    for (const n of names) {
      const store = db.transaction(n).objectStore(n);
      const all = await new Promise((res, rej) => {
        const r = store.getAll();
        r.onsuccess = () => res(r.result || []);
        r.onerror = () => rej(r.error);
      });
      summary[n] = all.length;
      if (n === 'message_blocks') {
        for (const b of all.slice(0, 3)) blocks.push(JSON.stringify(b).slice(0, 300));
      }
    }
    setTitle('DONE:' + JSON.stringify(summary));
    setTimeout(() => {
      document.body.textContent = 'DONE:' + JSON.stringify(summary) + '\n\nSAMPLE_BLOCKS:\n' + blocks.join('\n---\n');
    }, 50);
  } catch (e) {
    setTitle('ERR:' + e.message);
  }
};
</script>
</body>
</html>
